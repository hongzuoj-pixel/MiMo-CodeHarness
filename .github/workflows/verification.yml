name: verification-pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  structured-cases:
    name: structured-cases (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install ".[test]" "pytest==8.4.2"
      - name: Native Node and generic JUnit evidence/fault/recovery checks
        run: python -m pytest tests/test_node_evidence.py tests/test_junit_checks.py tests/test_product_acceptance.py -q --junitxml=structured-cases.xml
      - name: Pinned real Node defect and generic JUnit defect controls
        run: |
          mimo case-init --case ms-invalid-number --output .mimo/cases/ms
          mimo case-check --directory .mimo/cases/ms --name ci
          mimo case-init --case boltons-junit --output .mimo/cases/boltons-junit
          mimo case-check --directory .mimo/cases/boltons-junit --name ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-${{ matrix.os }}-node-${{ matrix.node }}
          include-hidden-files: true
          path: |
            structured-cases.xml
            .mimo/cases/*/case.json
            .mimo/cases/*/results/ci/acceptance.json
            .mimo/cases/*/results/ci/*.zip

  release-automation:
    needs: [structured-cases, agent-and-real-cases, evidence-gate-contract, docker-acceptance, cli-install, unit-and-smoke, real-python-case]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Record exact source and successful automated gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/ci_release_record.py --output .mimo/release/ci.json
      - name: Automated CI cannot replace live-model, user or license acceptance
        run: python -c "import json,subprocess; r=subprocess.run(['mimo','readiness','--ci-record','.mimo/release/ci.json'],capture_output=True,text=True); d=json.loads(r.stdout); assert r.returncode == 3 and d['accepted']['ci'] is True and len(d['pending']) == 3, r.stdout+r.stderr"
      - uses: actions/upload-artifact@v4
        with:
          name: source-bound-release-automation
          path: .mimo/release/ci.json
          include-hidden-files: true

  agent-and-real-cases:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install harness and pinned actual Codex CLI
        run: |
          python -m pip install ".[test]" "pytest==8.4.2"
          npm install --global @openai/codex@0.163.0
          mimo agent-init --model mimo-contract-test --output .mimo/codex-agent.json
      - name: Actual CLI against local Responses server, without a paid model
        env:
          MIMO_CODEX_BINARY: codex
        run: python -m pytest tests/test_codex_adapter.py -q --junitxml=codex-contract.xml
      - name: Two pinned real defects, reference and regression controls, fresh recovery
        run: |
          mimo case-init --case boltons-write --output .mimo/cases/boltons
          mimo case-check --directory .mimo/cases/boltons --name ci
          mimo case-init --case more-itertools-bucket --output .mimo/cases/more-itertools
          mimo case-check --directory .mimo/cases/more-itertools --name ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-real-cases-${{ matrix.os }}
          path: |
            codex-contract.xml
            .mimo/cases/*/case.json
            .mimo/cases/*/results/ci/acceptance.json
            .mimo/cases/*/results/ci/*.zip
          include-hidden-files: true
          if-no-files-found: error

  evidence-gate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness and test dependencies
        run: python -m pip install ".[test]" "pytest==8.4.2"
      - name: Actual CLI gate exits and portable PASS/FAIL evidence
        run: python tests/ci_gate_contract.py --output .mimo/ci-evidence-contract
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser checks for offline evidence reports
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/mimo-ui-tools" playwright@1.56.0
          python -m zipfile -e .mimo/ci-evidence-contract/PASS/evidence.zip .mimo/ci-evidence-contract/PASS/view
          python -m zipfile -e .mimo/ci-evidence-contract/FAIL/evidence.zip .mimo/ci-evidence-contract/FAIL/view
          node tests/check_offline_report.cjs "$RUNNER_TEMP/mimo-ui-tools/node_modules/playwright" .mimo/ci-evidence-contract .mimo/browser-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-gate-contract
          path: |
            .mimo/ci-evidence-contract/PASS/evidence.zip
            .mimo/ci-evidence-contract/PASS/gate.json
            .mimo/ci-evidence-contract/FAIL/evidence.zip
            .mimo/ci-evidence-contract/FAIL/gate.json
            .mimo/browser-qa
          include-hidden-files: true
          if-no-files-found: error

  docker-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build disposable acceptance image
        run: |
          python -m pip install ".[test]" "pytest==8.4.2"
          python -m pip download --dest tests/docker/wheels pytest==8.4.2
          docker build -t mimo-acceptance:ci tests/docker
      - name: Real Docker isolation acceptance
        env:
          MIMO_DOCKER_TEST_IMAGE: mimo-acceptance:ci
        run: python -m pytest tests/test_docker_execution.py -q --junitxml=docker-acceptance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-acceptance
          path: docker-acceptance.xml

  cli-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install package
        run: |
          python -m pip install "build==1.3.0" "pytest==8.4.2"
          python -m build --outdir .mimo/dist
          python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('.mimo/dist').glob('*.whl')); subprocess.run([sys.executable,'-m','pip','install',str(wheel)],check=True)"
      - name: Installed CLI and pytest evidence regression
        run: python -m pytest tests -q --junitxml=cli-pytest-results.xml
      - name: Exercise installed CLI
        run: |
          mimo --version
          mimo --config ci-mimo.json init --project demo_harmony_project --mode offline
          mimo --config ci-mimo.json doctor
          mimo --config ci-mimo.json run --name cli-install-smoke --limit-tasks 1
          mimo --config ci-mimo.json resume --run .mimo/runs/cli-install-smoke --name cli-install-resumed
          mimo --config ci-mimo.json report
          mimo export --run .mimo/runs/cli-install-resumed --output cli-install-evidence.zip
          python -c "import subprocess,sys; r=subprocess.run(['mimo','gate','--bundle','cli-install-evidence.zip','--json']); assert r.returncode == 3, r.returncode"
      - name: Complete external CLI repair example with installed package
        run: |
          mimo --config examples/cli_agent/mimo-harness.json doctor --agent-config examples/cli_agent/agent.json
          mimo --config examples/cli_agent/mimo-harness.json repair --agent-config examples/cli_agent/agent.json --task-file examples/cli_agent/task.txt --base WORKTREE --max-rounds 2 --name installed-repair
          mimo --config examples/cli_agent/mimo-harness.json resume --run examples/cli_agent/.mimo/runs/installed-repair --name recovered-repair
          mimo --config examples/cli_agent/mimo-harness.json report --run examples/cli_agent/.mimo/runs/recovered-repair
          mimo export --run examples/cli_agent/.mimo/runs/recovered-repair --output cli-repair-evidence.zip
          mimo gate --bundle cli-repair-evidence.zip
      - name: Prepare portable user-kit dependencies and rehearse clean installation
        run: |
          python -m pip download --only-binary=:all: --platform any --implementation py --abi none --dest .mimo/kit-wheels pip==25.0.1 pytest==8.4.2 iniconfig==2.1.0 packaging==25.0 pluggy==1.6.0 pygments==2.19.2 exceptiongroup==1.3.0 tomli==2.2.1 colorama==0.4.6 typing_extensions==4.15.0
          python -c "import pathlib,shutil; shutil.copy2(next(pathlib.Path('.mimo/dist').glob('*.whl')), '.mimo/kit-wheels')"
          python tests/ci_user_kit.py --wheelhouse .mimo/kit-wheels --output .mimo/user-kit-rehearsal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-pytest-${{ matrix.os }}
          path: |
            cli-pytest-results.xml
            .mimo/dist/*
            .mimo/user-kit-rehearsal/kit/
            .mimo/user-kit-rehearsal/rehearsal.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: independent-user-kit-${{ matrix.os }}
          path: .mimo/user-kit-rehearsal/kit/
          include-hidden-files: true
          if-no-files-found: error

  unit-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        pytest-version: ["8.4.2"]
        include:
          - python-version: "3.12"
            pytest-version: "9.0.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit and regression tests
        run: |
          python -m pip install ".[test]" "pytest==${{ matrix.pytest-version }}"
          python -m pytest tests -q --junitxml=pytest-results.xml
      - name: Scoring invariants
        run: python src/validate_scoring_v03.py
      - name: Offline end-to-end smoke test
        shell: bash
        run: |
          set +e
          python src/run_mimo_codeharness_v02.py \
            --project demo_harmony_project \
            --name ci_validation_v04 \
            --config config/api_models_mimo.json \
            --limit-tasks 6 \
            --apply-patches
          code=$?
          set -e
          if [[ "$code" -ne 0 && "$code" -ne 2 && "$code" -ne 3 ]]; then
            echo "Unexpected harness execution error: $code"
            exit "$code"
          fi
          cat outputs/mimo_codeharness_v02/ci_validation_v04/patch_results.json
          cat outputs/mimo_codeharness_v02/ci_validation_v04/verification_results.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/mimo_codeharness_v02/ci_validation_v04/verification_summary.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["overall_verdict"] in {
              "PASS", "FAIL", "INSUFFICIENT_EVIDENCE", "ERROR", "NOT_APPLICABLE"
          }
          assert "exit_code" in data
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python-version }}-${{ matrix.pytest-version }}
          path: pytest-results.xml

  real-python-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone pinned SlideNote case
        shell: bash
        run: |
          git clone --no-checkout https://github.com/Cat-blizzard/SlideNote.git external_repos/SlideNote
          git -C external_repos/SlideNote checkout fc0e351f15e5764d4da343c3182da35eb0b7a52e
      - name: Install pinned case test dependencies
        run: python -m pip install -e "external_repos/SlideNote[dev]"
      - name: Run baseline and candidate behavior tests
        shell: bash
        run: |
          set +e
          python src/run_mimo_codeharness_v02.py \
            --project external_repos/SlideNote \
            --name ci_slidenote_v04 \
            --config config/api_models_mimo.json \
            --limit-tasks 5 \
            --apply-patches \
            --run-build-tests
          code=$?
          set -e
          if [[ "$code" -eq 4 ]]; then
            echo "Harness execution error"
            exit "$code"
          fi
      - name: Validate real behavior evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/mimo_codeharness_v02/ci_slidenote_v04")
          baseline = json.loads(
              (root / "build_test_logs/build_test_summary.json").read_text(encoding="utf-8")
          )
          results = json.loads(
              (root / "verification_results.json").read_text(encoding="utf-8")
          )
          candidate_builds = json.loads(
              (root / "candidate_build_summaries.json").read_text(encoding="utf-8")
          )

          assert baseline["external_executed_count"] >= 1, baseline
          assert baseline["test_cases"], baseline
          refactor = next(item for item in results if item["task_id"] == "T005")
          assert refactor["verdict"] == "PASS", refactor
          assert refactor["external_tests_executed"] >= 1, refactor
          assert candidate_builds[refactor["candidate_id"]]["external_executed_count"] >= 1
          assert candidate_builds[refactor["candidate_id"]]["test_cases"]
          assert not refactor["missing_tests"], refactor
          assert not refactor["changed_acceptance_files"], refactor
          assert not Path("external_repos/SlideNote/CODEHARNESS_AGENT_NOTE.md").exists()
          PY
          test -z "$(git -C external_repos/SlideNote status --porcelain)"
